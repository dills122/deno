name: Capsule governed deno_core

on:
  pull_request:
    branches:
      - 'capsule/review-v2.9.4-r*'
      - 'capsule/accepted-v2.9.4-r*'
  push:
    branches:
      - 'capsule/review-v2.9.4-r*'
      - 'capsule/accepted-v2.9.4-r*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governed-source-and-fixtures:
    name: Governed admission
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact review state
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Verify governed source, fixtures, and restoration mutation
        run: node tools/capsule/governed-deno-core/verify.mjs
      - name: Initialize formatter support submodule
        run: git submodule update --init --recursive --depth=1 -- tests/util/std
      - name: Install exact formatter runtime
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: v2.9.4
      - name: Check canonical repository formatting
        run: deno run --allow-write --allow-read --allow-run --allow-net ./tools/format.js --check
      - name: Install pinned Rust toolchain
        uses: dsherret/rust-toolchain-file@3551321aa44dd44a0393eb3b6bdfbc5d25ecf621
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Compile the governed deno_core crate
        run: cargo check -p deno_core --locked
